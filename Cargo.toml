[workspace]
resolver = "3"
members = [
    "crates/moose",
    "crates/moose-core",
    "crates/moose-params",
    "crates/moose-clap",
    "crates/moose-vst3",
    "crates/moose-standalone",
    "crates/moose-driver",
    "crates/moose-gui",
    "crates/moose-gui-types",
    "crates/moose-gui-utils",
    "crates/moose-plugin",
    "crates/moose-test",
    "crates/moose-build",
    "crates/moose-loader",
    "crates/moose-loader-tests",
    "crates/moose-loader-tests/fixtures/reload-fixture-common",
    "crates/moose-loader-tests/fixtures/reload-fixture-keep-a",
    "crates/moose-loader-tests/fixtures/reload-fixture-keep-b",
    "crates/moose-loader-tests/fixtures/reload-fixture-reset",
    "crates/moose-derive",
    "crates/cargo-moose",
    "crates/moose-cpu",
    "crates/moose-gpu",
    "crates/moose-egui",
    "crates/moose-simd",
    "crates/moose-font",
    "crates/moose-utils",
    "examples/moose-example-gain",
    "examples/moose-example-gain-inplace",
    "examples/moose-example-block-gain",
    "examples/moose-example-block-saturate",
    "examples/moose-example-block-drywet",
    "examples/moose-example-block-gate",
    "examples/moose-example-block-widen",
    "examples/moose-example-block-surround-meter",
    "examples/moose-example-sidechain",
    "examples/moose-example-synth",
    "examples/moose-example-eq",
    "examples/moose-example-stereo-utility",
    "examples/moose-example-transpose",
    "examples/moose-example-arpeggio",
    "examples/moose-example-gain-egui",
    "examples/moose-example-gain-egui-aspect",
    "examples/moose-example-tremolo",
    "examples/moose-example-state",
    "examples/moose-example-fundsp-reverb-worker",
    "examples/moose-example-fundsp-reverb-simple",
    "examples/moose-example-gui-zoo",
    "examples/moose-example-gui-zoo-egui",
    "examples/moose-example-dasp-bitcrusher",
    "examples/moose-example-envelope",
    "examples/moose-example-chord",
    "examples/moose-example-cc-filter",
    "examples/moose-example-mpe-spreader",
    "examples/moose-example-sysex-echo",
    "examples/moose-example-mpe-synth",
    "examples/moose-example-multiport",
]

[workspace.package]
version = "7.0.0"
edition = "2024"
# The Truce License: the dual Apache-2.0 / MIT permissive grant (texts
# in LICENSE-APACHE, LICENSE-MIT) plus a permission-gated rider for
# redistributing moose as a commercial framework or service. Full text
# in LICENSE; the SPDX `LicenseRef-` carries it as a custom identifier
# (the rider is not captured by `Apache-2.0 OR MIT` alone).
license = "LicenseRef-TruceLicense-1.0"
rust-version = "1.92"
description = "Build audio plugins in Rust. One codebase, every format."
repository = "https://github.com/Matari-Audio/moose"
homepage = "https://github.com/Matari-Audio/moose"
categories = ["multimedia::audio", "development-tools::cargo-plugins"]
keywords = ["audio", "plugin", "vst3", "clap", "daw"]
readme = "README.md"

# Workspace-wide lint config. Crates opt in with `lints.workspace = true`.
# `objc` 0.2's `msg_send!` / `class!` / `sel!` macros emit
# `#[cfg(feature = "cargo-clippy")]` checks against the destination crate;
# whitelist that cfg value so the unexpected_cfgs lint stops complaining
# about an upstream macro-hygiene issue.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Workspace deps. Every internal `moose-*` entry pins
# `version = "<workspace version>"` alongside `path = "..."`. The
# version is load-bearing for `cargo publish` — cargo strips `path`
# at publish time and embeds the registry version, so every internal
# dep referenced by `workspace = true` from another published crate
# must declare the registry version up front. `bump.sh` rewrites all
# of these in one pass with a global sed on the version string.
[workspace.dependencies]
# `default-features = false` at the workspace so individual examples
# can override per-format gating. The examples each
# explicitly enable `moose/<format>` in their own `[features]` block
# (`clap = ["…", "moose/clap"]`).
moose = { version = "7.0.0", path = "crates/moose", default-features = false }
moose-core = { version = "7.0.0", path = "crates/moose-core" }
moose-params = { version = "7.0.0", path = "crates/moose-params" }
moose-clap = { version = "7.0.0", path = "crates/moose-clap" }
moose-vst3 = { version = "7.0.0", path = "crates/moose-vst3" }
moose-standalone = { version = "7.0.0", path = "crates/moose-standalone" }
moose-driver = { version = "7.0.0", path = "crates/moose-driver" }
# `default-features = false` at the workspace so members pick a
# renderer feature (`cpu` / `gpu`) explicitly - lets one example
# (moose-example-eq) opt into `gpu` while the rest use `cpu`, and
# lets the renderer crate (moose-egui) build
# moose-gui featureless for its types-only surface. External users
# adding `moose-gui = "x"` still get the `cpu` default.
moose-gui = { version = "7.0.0", path = "crates/moose-gui", default-features = false }
moose-gui-types = { version = "7.0.0", path = "crates/moose-gui-types" }
moose-gui-utils = { version = "7.0.0", path = "crates/moose-gui-utils" }
moose-plugin = { version = "7.0.0", path = "crates/moose-plugin" }
moose-test = { version = "7.0.0", path = "crates/moose-test" }
moose-loader = { version = "7.0.0", path = "crates/moose-loader" }
moose-derive = { version = "7.0.0", path = "crates/moose-derive" }
moose-cpu = { version = "7.0.0", path = "crates/moose-cpu" }
moose-gpu = { version = "7.0.0", path = "crates/moose-gpu" }
moose-egui = { version = "7.0.0", path = "crates/moose-egui" }
moose-simd = { version = "7.0.0", path = "crates/moose-simd" }
moose-font = { version = "7.0.0", path = "crates/moose-font" }
moose-build = { version = "7.0.0", path = "crates/moose-build" }
moose-utils = { version = "7.0.0", path = "crates/moose-utils" }

# Common third-party deps consumed by multiple workspace crates.
# Hoisted here so version bumps are a one-line change. wgpu and the
# wgpu-backed UI bridge crates use the same wgpu version under the
# hood; pinning them together prevents the GUI crates from drifting
# onto incompatible wgpu major versions.
thiserror = "2"
toml = "1"
# Plist `<data>` payloads and the
# `.preset` TOML `extra` field. Build-time crates only - moose-utils
# and the runtime wrappers stay base64-free.
base64 = "0.22"
# wgpu's default features include `webgpu` (browser) and `webgl`
# (browser GLES fallback). Plugins ship as native dylibs in DAWs,
# never the browser, so opt out of those. Only `wgsl` (the shader
# source format) lives here; per-OS backends (`metal`, `dx12`,
# `vulkan`, `gles`) are added via target-conditional deps in
# `moose-gpu/Cargo.toml`, then unified across the workspace.
wgpu = { version = "29", default-features = false, features = ["wgsl"] }

# The owned fork carries the Pro Tools close-path fix
# (responder / tracking-area / layer-contents cleanup) and X11 repeat
# normalization for stable host key ownership. Pin the reviewed revision
# until the next `baseview-truce` release; the `package =` rename keeps every
# `use baseview::*` in the GUI crates compiling unchanged. GUI crates
# consume this via `baseview = { workspace = true }` so the registry
# pin lives in exactly one place.
baseview = { package = "baseview-truce", git = "https://github.com/DerpcatMusic/baseview.git", rev = "15cf1fe518e7ad53ec0c7d1fd98fbbd9091a0866" }

# Custom profile for shell-mode (hot-reload) builds. `cargo moose
# install --shell` invokes `cargo build --profile shell --features
# ...,shell`, so the shell binary lands at `target/shell/lib<crate>.dylib`
# — independent of `target/release/` and `target/debug/`. Inheriting
# from "release" gives release-quality DSP perf for testing while
# leaving the regular release / debug profiles untouched for
# `cargo build` / `cargo build --release`.
[profile.shell]
inherits = "release"
