# cargo-deny policy for the workspace, applied via `cargo deny check
# --config <this file>` (see scripts/supply-chain.sh).

[advisories]
# Unmaintained transitive crate with no published vulnerability. Not a
# first-party dependency - resolves only when an upstream proc-macro dep
# bumps. Tracked here so a *new* advisory still fails the gate.
ignore = [
    # INFO unmaintained, reviewed 2026-11-09; review again by 2027-02-01.
    # winit/sctk-adwaita use ab_glyph/owned_ttf_parser; their maintainers
    # need to migrate font parsing to skrifa before this can be removed.
    "RUSTSEC-2026-0192", # ttf-parser
    # accesskit_unix and atspi depend on zbus 5 and its separate crates.
    # Their maintainers need to migrate to zbus 6's names and wire modules.
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0372", # zvariant_derive

    "RUSTSEC-2024-0436", # paste - unmaintained (proc-macro, deep transitive)
    # quick-xml 0.39 DoS advisories (quadratic duplicate-attribute check;
    # unbounded NsReader namespace allocation). Rides in via plist <-
    # cargo-moose, which never hits either affected path: plist parses
    # with the plain `Reader` (no `NsReader` / `NamespaceResolver`) and
    # never calls `.attributes()`. cargo-moose also only parses local,
    # self-generated plists, not untrusted XML. plist 1.9.0 pins
    # quick-xml ^0.39, so no upgrade exists; drop both ignores when a
    # plist release moves to quick-xml >= 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
# Union of every license encountered across these workspaces. A given
# workspace only sees a subset, so don't warn on allow entries it never
# hits.
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "OFL-1.1",         # epaint_default_fonts embeds OFL fonts (AND clause)
    "Ubuntu-font-1.0", # epaint_default_fonts embeds the Ubuntu font (AND clause)
    # moose's own crates: the dual MIT/Apache grant plus the framework
    # rider, carried as a custom SPDX identifier (see LICENSE).
    "LicenseRef-TruceLicense-1.0",
]

[bans]
# Duplicate crate versions are unavoidable in a wide GUI/host tree
# (windows-* generations, hashbrown, thiserror, tiny-skia, ...). Surface
# them without failing the gate.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/Matari-Audio/MUI", "https://github.com/Matari-Audio/matari-audio-drag-and-drop"]
