[package]
name = "moose-example-eq"
# Internal-only - workspace demonstrations not for crates.io.
publish = false
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "moose-example-eq-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["clap", "vst3"]
clap = ["dep:moose-clap", "dep:clap-sys"]
vst3 = ["dep:moose-vst3"]
standalone = ["dep:moose-standalone"]
shell = ["moose/shell"]
rt-paranoid = ["moose/rt-paranoid"]

[dependencies]
moose = { workspace = true }
moose-core = { workspace = true }
moose-params = { workspace = true }
moose-simd = { workspace = true }
# Cookbook biquad filters. 0.6 split the trait into `<C, T>` with
# minimal bounds on T (Copy + Add + Sub + Zero), which lets the
# local `biquad.rs` newtype `wide::f64x2` for parallel-channel
# SIMD without impl-ing the full num_traits::Float surface on it.
biquad = "0.6"
num-traits = "0.2"
wide = "0.7"
moose-clap = { workspace = true, optional = true }
moose-vst3 = { workspace = true, optional = true }
clap-sys = { version = "0.5", optional = true }
moose-standalone = { workspace = true, features = ["gui"], optional = true }
moose-gui-types = { workspace = true }
moose-gui = { workspace = true, features = ["cpu"] }
moose-loader = { workspace = true }


[dev-dependencies]
moose-test = { workspace = true }

[lints]
workspace = true
