[package]
name = "moose-example-dasp-bitcrusher"
publish = false
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bitcrusher example showing `dasp::Sample` bit-depth conversion."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "moose-example-dasp-bitcrusher-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["clap", "vst3", "standalone-playback"]
clap = ["dep:moose-clap", "dep:clap-sys"]
vst3 = ["dep:moose-vst3"]
standalone = ["dep:moose-standalone"]
standalone-playback = ["standalone", "moose-standalone/playback"]
shell = ["moose/shell"]
rt-paranoid = ["moose/rt-paranoid"]

[dependencies]
moose = { workspace = true }
moose-core = { workspace = true }
moose-params = { workspace = true }
moose-clap = { workspace = true, optional = true }
moose-vst3 = { workspace = true, optional = true }
clap-sys = { version = "0.5", optional = true }
moose-standalone = { workspace = true, features = ["gui"], optional = true }
moose-gui-types = { workspace = true }
moose-gui = { workspace = true, features = ["cpu"] }
moose-loader = { workspace = true }
dasp_sample = "0.11"

[dev-dependencies]
moose-test = { workspace = true }

[lints]
workspace = true
