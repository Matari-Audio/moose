[package]
name = "moose-example-gain-mui"
# Internal-only - workspace demonstrations not for crates.io.
publish = false
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
# MUI needs 1.98.
rust-version = "1.98"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["clap", "vst3", "au"]
clap = ["dep:moose-clap", "dep:clap-sys"]
vst3 = ["dep:moose-vst3"]
au = ["dep:moose-au"]

[dependencies]
moose = { workspace = true, features = ["mui"] }
moose-clap = { workspace = true, optional = true }
moose-vst3 = { workspace = true, optional = true }
moose-au = { workspace = true, optional = true }
clap-sys = { version = "0.5", optional = true }
moose-font = { workspace = true }

[dev-dependencies]
moose-test = { workspace = true }

[lints]
workspace = true
