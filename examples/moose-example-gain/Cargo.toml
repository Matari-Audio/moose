[package]
name = "moose-example-gain"
# Internal-only - workspace demonstrations not for crates.io.
publish = false
version = "7.0.0"
repository = "https://github.com/Matari-Audio/moose"
edition = "2024"
license = "LicenseRef-TruceLicense-1.0"
rust-version = "1.92"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "moose-example-gain-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["clap", "vst3", "au", "standalone-playback"]
clap = ["dep:moose-clap", "dep:clap-sys"]
vst3 = ["dep:moose-vst3"]
au = ["dep:moose-au"]
standalone = ["dep:moose-standalone"]
standalone-playback = ["standalone", "moose-standalone/playback"]
shell = ["moose/shell"]
rt-paranoid = ["moose/rt-paranoid"]

[dependencies]
# Workspace declares `moose` with `default-features = false`; this
# example's per-format `[features]` propagate to `moose/<format>`
# explicitly so the macOS default build behaviour is unchanged.
moose = { version = "7.0.0", path = "../../crates/moose", default-features = false }
moose-core = { version = "7.0.0", path = "../../crates/moose-core" }
moose-params = { workspace = true }
moose-clap = { version = "7.0.0", path = "../../crates/moose-clap", optional = true }
moose-vst3 = { version = "7.0.0", path = "../../crates/moose-vst3", optional = true }
moose-au = { version = "7.0.0", path = "../../crates/moose-au", optional = true }
clap-sys = { version = "0.5", optional = true }
moose-standalone = { version = "7.0.0", path = "../../crates/moose-standalone", features = ["gui"], optional = true }
moose-loader = { workspace = true }


[dev-dependencies]
moose-test = { version = "7.0.0", path = "../../crates/moose-test" }
# `moose-driver` is the offline-render harness `moose-test::driver!`
# wraps. The `chunker_perf` integration test uses `moose_driver::Script`
# directly to script per-block automation densities.
moose-driver = { workspace = true }
hound = "3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
chunks_exact_to_as_chunks = "allow"
large_stack_arrays = "deny"
large_stack_frames = "deny"
large_types_passed_by_value = "warn"
