[package]
name = "truce-example-dasp-bitcrusher"
publish = false
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bitcrusher example showing `dasp::Sample` bit-depth conversion."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "truce-example-dasp-bitcrusher-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["clap", "vst3", "standalone-playback"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]
standalone = ["dep:truce-standalone"]
standalone-playback = ["standalone", "truce-standalone/playback"]
shell = ["truce/shell"]
rt-paranoid = ["truce/rt-paranoid"]

[dependencies]
truce = { workspace = true }
truce-core = { workspace = true }
truce-params = { workspace = true }
truce-clap = { workspace = true, optional = true }
truce-vst3 = { workspace = true, optional = true }
clap-sys = { version = "0.5", optional = true }
truce-standalone = { workspace = true, features = ["gui"], optional = true }
truce-gui-types = { workspace = true }
truce-gui = { workspace = true, features = ["cpu"] }
truce-loader = { workspace = true }
dasp_sample = "0.11"

[dev-dependencies]
truce-test = { workspace = true }

[lints]
workspace = true
