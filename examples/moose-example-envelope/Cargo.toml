[package]
name = "moose-example-envelope"
# Internal-only - workspace demonstration not for crates.io.
publish = false
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["clap", "vst3"]
clap = ["dep:moose-clap", "dep:clap-sys"]
vst3 = ["dep:moose-vst3"]
shell = ["moose/shell"]
rt-paranoid = ["moose/rt-paranoid"]

[dependencies]
moose = { workspace = true }
moose-core = { workspace = true }
moose-params = { workspace = true }
moose-clap = { workspace = true, optional = true }
moose-vst3 = { workspace = true, optional = true }
clap-sys = { version = "0.5", optional = true }
moose-gui-types = { workspace = true }
moose-gui = { workspace = true, features = ["cpu"] }
moose-loader = { workspace = true }

[dev-dependencies]
moose-test = { workspace = true }

[lints]
workspace = true
