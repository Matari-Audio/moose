[package]
name = "moose-example-sidechain"
# Internal-only - workspace demonstrations not for crates.io.
publish = false
version = "7.0.0"
repository = "https://github.com/Matari-Audio/moose"
edition = "2024"
license = "LicenseRef-TruceLicense-1.0"
rust-version = "1.92"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "moose-example-sidechain-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["clap", "vst3", "au"]
clap = ["dep:moose-clap", "dep:clap-sys"]
vst3 = ["dep:moose-vst3"]
au = ["dep:moose-au"]
standalone = ["dep:moose-standalone"]
shell = ["moose/shell"]
rt-paranoid = ["moose/rt-paranoid"]

[dependencies]
moose = { version = "7.0.0", path = "../../crates/moose", default-features = false }
moose-core = { version = "7.0.0", path = "../../crates/moose-core" }
moose-params = { workspace = true }
moose-clap = { version = "7.0.0", path = "../../crates/moose-clap", optional = true }
moose-vst3 = { version = "7.0.0", path = "../../crates/moose-vst3", optional = true }
moose-au = { version = "7.0.0", path = "../../crates/moose-au", optional = true }
clap-sys = { version = "0.5", optional = true }
# `playback` so `cargo moose run --input-file x.wav` can feed the file
# into the sidechain input (the mic stays on the main input).
moose-standalone = { version = "7.0.0", path = "../../crates/moose-standalone", features = ["gui", "playback"], optional = true }
moose-loader = { workspace = true }


[dev-dependencies]
moose-test = { version = "7.0.0", path = "../../crates/moose-test" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
chunks_exact_to_as_chunks = "allow"
large_stack_arrays = "deny"
large_stack_frames = "deny"
large_types_passed_by_value = "warn"
