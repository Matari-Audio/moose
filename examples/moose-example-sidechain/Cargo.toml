[package]
name = "moose-example-sidechain"
# Internal-only - workspace demonstrations not for crates.io.
publish = false
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "moose-example-sidechain-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["clap", "vst3", "au"]
clap = ["dep:moose-clap", "dep:clap-sys"]
vst3 = ["dep:moose-vst3"]
au = ["dep:moose-au"]
standalone = ["dep:moose-standalone"]
shell = ["moose/shell"]
rt-paranoid = ["moose/rt-paranoid"]

[dependencies]
moose = { workspace = true }
moose-core = { workspace = true }
moose-params = { workspace = true }
moose-clap = { workspace = true, optional = true }
moose-vst3 = { workspace = true, optional = true }
moose-au = { workspace = true, optional = true }
clap-sys = { version = "0.5", optional = true }
# `playback` so `cargo moose run --input-file x.wav` can feed the file
# into the sidechain input (the mic stays on the main input).
moose-standalone = { workspace = true, features = ["gui", "playback"], optional = true }
moose-gui-types = { workspace = true }
moose-gui = { workspace = true, features = ["cpu"] }
moose-loader = { workspace = true }


[dev-dependencies]
moose-test = { workspace = true }

[lints]
workspace = true
