[package]
name = "moose-vst3"
version.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "VST3 format wrapper for moose, on the official VST3 SDK bindings"

[dependencies]
moose-core = { workspace = true }
moose-params = { workspace = true }
# Wait-free bounded queue for the host/editor → audio state-load
# handoff so the audio thread is the only one that ever holds
# `&mut Plugin`.
crossbeam-queue = "0.3"
vst3 = "0.3.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true

[dev-dependencies]
moose-derive = { workspace = true }
moose-test-fixtures = { workspace = true }
