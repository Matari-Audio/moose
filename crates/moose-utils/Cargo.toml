[package]
name = "moose-utils"
version = "7.0.0"
edition = "2024"
license = "LicenseRef-TruceLicense-1.0"
rust-version = "1.92"
repository = "https://github.com/Matari-Audio/moose"
description = "Lightweight, dependency-free utilities shared across the moose workspace (numeric-cast helpers, slug)"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
chunks_exact_to_as_chunks = "allow"
large_stack_arrays = "deny"
large_stack_frames = "deny"
large_types_passed_by_value = "warn"
