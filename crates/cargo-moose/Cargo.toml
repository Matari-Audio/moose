[package]
name = "cargo-moose"
version.workspace = true
edition = "2024"
# The Truce License (LicenseRef-TruceLicense-1.0), same as the
# workspace - dual Apache-2.0 / MIT plus the framework rider in LICENSE.
license.workspace = true
description = "Build tool for moose audio plugins (CLAP, VST3, and a standalone host binary)"
repository = "https://github.com/Matari-Audio/moose"
keywords = ["audio", "plugin", "vst", "clap", "midi"]
categories = [
    "multimedia::audio",
    "development-tools::build-utils",
    "development-tools::cargo-plugins",
]

[lib]
name = "cargo_moose"
path = "src/lib.rs"

[[bin]]
name = "cargo-moose"
path = "src/main.rs"

[dependencies]
thiserror = { workspace = true }
toml = { workspace = true }
serde = { version = "1", features = ["derive"] }
# Substitution engine for `cargo moose new` scaffolds. Single dep on
# top of the existing serde - the only transitive that lands.
tinytemplate = "1.2"
# `cargo moose screenshot --check` decodes the rendered + reference
# PNGs to count differing pixels. Same crate moose-core uses for
# its FFI-side encode path; keeping versions aligned avoids
# transitive duplication when both are in a workspace build.
png = "0.18"
moose-build = { workspace = true }
moose-utils = { workspace = true }
base64 = { workspace = true }
# `cargo moose preset`: decode host-saved `.aupreset` files (Logic
# writes binary plists) and read/write preset packs.
plist = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dependencies.libloading]
version = "0.9"

# Post-link icon embed for the standalone host .exe lives in
# `windows_manifest::embed_icon` and calls `BeginUpdateResource` /
# `UpdateResource` / `EndUpdateResource` directly - same shell-out-free
# pattern as the mt.exe-driven manifest embed sitting next to it.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader"] }

[dev-dependencies]
hound = "3"

[lints]
workspace = true
