[package]
name = "moose-gui"
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Built-in GUI for moose plugins"

[dependencies]
moose-core = { workspace = true }
# `moose-cpu` (tiny-skia + skrifa) and `moose-gpu` (wgpu) are the
# two `RenderBackend` impls. Both optional, gated by the `cpu`
# (default) / `gpu` features so plugins that opt into one don't
# pull the other's compile.
moose-cpu = { workspace = true, optional = true }
moose-gpu = { workspace = true, optional = true }
moose-gui-types = { workspace = true }
moose-gui-utils = { workspace = true }
moose-params = { workspace = true }
moose-plugin = { workspace = true }
raw-window-handle = "0.6"
wgpu = { workspace = true }
pollster = "0.4"
log = "0.4"

# baseview hosts the editor on macOS / Windows / Linux. iOS embeds
# a UIView directly into the AUv3 view controller - no baseview.
[target.'cfg(not(target_os = "ios"))'.dependencies]
baseview = { workspace = true }

# wgpu backend features, per OS. moose-gui's blit pipeline (cpu
# mode) and `GpuEditor` (gpu mode) both need a usable wgpu backend
# regardless of which feature is on. moose-gpu used to provide
# these transitively; now that moose-gpu is optional, moose-gui
# declares them itself so wgpu always has a backend available.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }

# iOS UIKit + CoreGraphics bridging for the UIView host.
[target.'cfg(target_os = "ios")'.dependencies]
# iOS always rasterizes with the CPU backend (tiny-skia → CGImage →
# UIView layer contents); the `gpu` wgpu path is desktop-only. So
# moose-cpu is a hard dependency here regardless of the `cpu` / `gpu`
# features a plugin picks — a gpu-only iOS build (e.g. an example that
# sets `features = ["gpu"]`) still needs the CPU rasterizer.
moose-cpu = { workspace = true }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
objc2-ui-kit = { version = "0.3", features = ["UIView", "UIScreen", "UIWindow"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer"] }

[target.'cfg(not(target_os = "ios"))'.dev-dependencies]
keyboard-types = "0.8"

[features]
# `cpu` is the default - tiny-skia software rasterizer with a wgpu
# blit pipeline for surface presentation. `gpu` swaps in direct wgpu
# rendering through `moose_gpu::WgpuBackend`; opting in via
# `default-features = false, features = ["gpu"]` keeps moose-cpu
# (and tiny-skia + skrifa) out of the dep tree.
default = ["cpu"]
# Both features need moose-gpu: `gpu` for `WgpuBackend`, `cpu` for the
# surface pump (`moose_gpu::pump`) its blit presentation runs through.
cpu = ["dep:moose-cpu", "dep:moose-gpu"]
gpu = ["dep:moose-gpu"]

[lints]
workspace = true

