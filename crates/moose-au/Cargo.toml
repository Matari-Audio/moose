[package]
name = "moose-au"
version = "7.0.0"
repository = "https://github.com/Matari-Audio/moose"
edition = "2024"
license = "LicenseRef-TruceLicense-1.0"
rust-version = "1.92"
description = "Audio Unit v3 format wrapper for moose"

# Declaring a cdylib crate-type here (in addition to the default rlib)
# makes cargo accept this crate's `rustc-link-arg-cdylib=` directives
# without warning. The real cdylib is produced by the consumer (the
# plugin's example crate); the empty cdylib cargo builds for this
# crate is unused. Links cleanly thanks to weak C stubs for
# `moose_au_init` / `MooseAUFactory` in `shim/au_shim_common.c`, which
# the consumer's `export_au!`-generated strong definitions override.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
moose-core = { version = "7.0.0", path = "../moose-core" }
moose-params = { workspace = true }
# Wait-free bounded queue for the host/editor → audio state-load
# handoff so the audio thread is the only one that ever holds
# `&mut Plugin`.
crossbeam-queue = "0.3"

[build-dependencies]
cc = "1"
moose-shim-types = { workspace = true }

# Only used by the `sysex_pool_prealloc_matches_header` mirror test
# in `lib.rs` - the runtime AU shim talks to the header through C,
# not through this Rust string view.
[dev-dependencies]
moose-derive = { workspace = true }
moose-test-fixtures = { workspace = true }
moose-shim-types = { workspace = true }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
chunks_exact_to_as_chunks = "allow"
large_stack_arrays = "deny"
large_stack_frames = "deny"
large_types_passed_by_value = "warn"
