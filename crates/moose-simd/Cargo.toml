[package]
name = "moose-simd"
version = "7.0.0"
repository = "https://github.com/Matari-Audio/moose"
edition = "2024"
license = "LicenseRef-TruceLicense-1.0"
rust-version = "1.92"
description = "Portable SIMD primitives + block-rate audio ops for moose plugins."

[features]
default = ["wide-backend"]
# Stable Rust SIMD via the `wide` crate. Tracks the same f32x4 /
# f32x8 / f64x2 / f64x4 vocabulary as `core::simd`; will swap when
# portable-simd stabilizes.
wide-backend = ["dep:wide"]

[dependencies]
wide = { version = "0.7", optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
moose-params = { workspace = true }
moose-core = { version = "7.0.0", path = "../moose-core" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
chunks_exact_to_as_chunks = "allow"
large_stack_arrays = "deny"
large_stack_frames = "deny"
large_types_passed_by_value = "warn"

[[bench]]
name = "audio_ops"
harness = false
