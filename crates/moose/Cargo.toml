[package]
name = "moose"
version = "7.0.0"
repository = "https://github.com/Matari-Audio/moose"
edition = "2024"
license = "LicenseRef-TruceLicense-1.0"
rust-version = "1.92"
description = "Audio plugin framework - write once, build CLAP, VST3, AU v2, AU v3, and a standalone host binary"
keywords = ["audio", "plugin", "vst", "clap", "midi"]
categories = ["multimedia::audio"]

[dependencies]
moose-core = { version = "7.0.0", path = "../moose-core" }
# `moose-plugin` carries the `Plugin` trait. Neither pulls a renderer —
# enable `moose`'s `mui` feature for `moose::mui::MuiEditor`.
moose-plugin = { workspace = true }
moose-params = { workspace = true }
moose-loader = { workspace = true }
moose-derive = { workspace = true }

[features]
default = ["clap"]
clap = ["dep:moose-clap"]
# CLAP 1.2.10 draft-extension bindings (`moose_clap::draft`).
clap-draft = ["clap", "moose-clap/clap-draft"]
vst3 = ["dep:moose-vst3"]
# MUI editors (`moose::mui`): `MuiEditor` and the parameter `Bridge`.
mui = ["dep:moose-mui"]
au = ["dep:moose-au"]
aax = ["dep:moose-aax"]
shell = ["moose-loader/shell"]
hot-debug = ["moose-loader/hot-debug"]
# Paranoid real-time allocation checking (dev/test). Enables the check in
# `process`; install the allocator at your crate root with
# `moose::enable_rt_paranoid!()`.
rt-paranoid = ["moose-core/rt-paranoid"]

[dependencies.moose-clap]
version = "7.0.0"
path = "../moose-clap"
optional = true

[dependencies.moose-vst3]
version = "7.0.0"
path = "../moose-vst3"
optional = true

[dependencies.moose-mui]
workspace = true
optional = true

[dependencies.moose-au]
version = "7.0.0"
path = "../moose-au"
optional = true

[dependencies.moose-aax]
workspace = true
optional = true

[dev-dependencies]
moose-dsp = { version = "7.0.0", path = "../moose-dsp" }
moose-test = { version = "7.0.0", path = "../moose-test" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
chunks_exact_to_as_chunks = "allow"
large_stack_arrays = "deny"
large_stack_frames = "deny"
large_types_passed_by_value = "warn"
