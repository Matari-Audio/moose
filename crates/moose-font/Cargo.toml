[package]
name = "moose-font"
version = "7.0.0"
repository = "https://github.com/Matari-Audio/moose"
edition = "2024"
# Plain Apache 2.0 - this crate exposes bundled font bytes only; no
# Framework License carve-out applies. The bundled `JetBrainsMono-Regular.ttf`
# asset is governed separately by the SIL Open Font License 1.1, included
# alongside the font as `fonts/OFL.txt` per the OFL's distribution terms.
license = "Apache-2.0"
rust-version = "1.92"
description = "Bundled fonts for the moose audio plugin framework. JetBrains Mono is bundled under the SIL Open Font License 1.1."

# The font binary is the whole point of this crate; ship it.
include = [
    "src/**",
    "fonts/JetBrainsMono-Regular.ttf",
    "fonts/OFL.txt",
    "README.md",
]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
chunks_exact_to_as_chunks = "allow"
large_stack_arrays = "deny"
large_stack_frames = "deny"
large_types_passed_by_value = "warn"
