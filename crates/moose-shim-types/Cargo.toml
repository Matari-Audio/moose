[package]
name = "moose-shim-types"
version = "7.0.0"
repository = "https://github.com/Matari-Audio/moose"
edition = "2024"
license = "LicenseRef-TruceLicense-1.0"
rust-version = "1.92"
description = "Shared C header types for the moose AU shim"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
chunks_exact_to_as_chunks = "allow"
large_stack_arrays = "deny"
large_stack_frames = "deny"
large_types_passed_by_value = "warn"
