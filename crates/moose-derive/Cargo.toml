[package]
name = "moose-derive"
version = "7.0.0"
repository = "https://github.com/Matari-Audio/moose"
edition = "2024"
license = "LicenseRef-TruceLicense-1.0"
description = "Proc macros for moose plugins, providing plugin_info!() to generate metadata from moose.toml at compile time"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
toml = { workspace = true }
moose-build = { workspace = true }
moose-params = { workspace = true }
moose-utils = { version = "7.0.0", path = "../moose-utils" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
chunks_exact_to_as_chunks = "allow"
large_stack_arrays = "deny"
large_stack_frames = "deny"
large_types_passed_by_value = "warn"
