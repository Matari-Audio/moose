[package]
name = "moose-derive"
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
description = "Proc macros for moose plugins, providing plugin_info!() to generate metadata from moose.toml at compile time"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
toml = { workspace = true }
moose-build = { workspace = true }
moose-params = { workspace = true }
moose-utils = { workspace = true }

[lints]
workspace = true
