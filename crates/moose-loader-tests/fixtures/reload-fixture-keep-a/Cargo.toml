[package]
name = "reload-fixture-keep-a"
version = "7.0.0"
repository = "https://github.com/Matari-Audio/moose"
edition = "2024"
license = "LicenseRef-TruceLicense-1.0"
description = "Reload-transition fixture (CounterState). Paired with keep-b to exercise the code-only, same-fingerprint reload path. Internal test-only."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
moose = { version = "7.0.0", path = "../../../moose", default-features = false }
moose-loader = { workspace = true }
reload-fixture-common = { path = "../reload-fixture-common" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
chunks_exact_to_as_chunks = "allow"
large_stack_arrays = "deny"
large_stack_frames = "deny"
large_types_passed_by_value = "warn"
