[package]
name = "moose-dsp"
version = "7.0.0"
edition = "2024"
license = "LicenseRef-TruceLicense-1.0"
rust-version = "1.92"
repository = "https://github.com/Matari-Audio/moose"
description = "Realtime-safe DSP primitives shared by moose plugins: time constants, smoothers, followers, biquads, SVFs, windows and FFTs"

[features]
# Complex FFTs over rustfft. Off by default: most plugins need only the filters.
fft = ["dep:rustfft"]

[dependencies]
rustfft = { version = "6.4", optional = true }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
chunks_exact_to_as_chunks = "allow"
large_stack_arrays = "deny"
large_stack_frames = "deny"
large_types_passed_by_value = "warn"

[package.metadata.docs.rs]
all-features = true
