[package]
name = "moose-gui-utils"
description = "Host-side platform helpers shared by moose GUI backends (macOS NSView anchoring, etc)."
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# `HasWindowHandle` appears in the public function signatures on every
# platform (the non-macOS stubs are no-ops but still take the type),
# so this dep stays unconditional. `objc` is only needed for the
# macOS impl, so it's behind a target gate below.
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

# For the WGL hardware-OpenGL probe (see `wgl_extensions_available`).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
