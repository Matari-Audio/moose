# MIDI-capability demos. These exercise plugin-to-host MIDI output and
# the `midi_input` / `midi_output` capability flags.

[[plugin]]
name = "Moose Envelope"
bundle_id = "envelope"
crate = "moose-example-envelope"
category = "effect"
midi_output = true
fourcc = "TEnv"
windows_icon = "static/moose-minimal.ico"
macos_icon = "static/moose-minimal.icns"

[[plugin]]
name = "Moose Chord"
bundle_id = "chord"
crate = "moose-example-chord"
category = "instrument"
midi_output = true
fourcc = "TChd"
vst3_subcategory = "Synth"
windows_icon = "static/moose-minimal.ico"
macos_icon = "static/moose-minimal.icns"

[[plugin]]
name = "Moose CC Filter"
bundle_id = "cc-filter"
crate = "moose-example-cc-filter"
category = "effect"
midi_input = true
fourcc = "TCcf"
vst3_subcategory = "Filter"
windows_icon = "static/moose-minimal.ico"
macos_icon = "static/moose-minimal.icns"

[[plugin]]
name = "Moose Channel Spread"
bundle_id = "chan-spread"
crate = "moose-example-mpe-spreader"
category = "midi"
# Fans notes across channels and adds per-note expression. Pure MIDI 2.0
# (2.0 in and out) so the whole chain speaks one protocol - the
# spreader handles both 1.0 and 2.0 note input and always emits 2.0.
midi2 = true
fourcc = "TMpe"
windows_icon = "static/moose-minimal.ico"
macos_icon = "static/moose-minimal.icns"

[[plugin]]
name = "Moose SysEx Echo"
bundle_id = "sysex-echo"
crate = "moose-example-sysex-echo"
category = "midi"
# 2.0 output so the echo exercises SysEx-over-UMP (SysEx-7 packet
# chains); input stays 1.0.
midi2_output = true
fourcc = "TSxe"
windows_icon = "static/moose-minimal.ico"
macos_icon = "static/moose-minimal.icns"

[[plugin]]
name = "Moose MPE Synth"
bundle_id = "mpe-synth"
crate = "moose-example-mpe-synth"
# Per-note-expressive instrument (MIDI in, audio out). `midi2 = true` makes
# the host deliver native MIDI 2.0, so per-note pitch bend / brightness land
# at 32-bit resolution; channel -> stereo pan.
category = "instrument"
midi2 = true
fourcc = "TMps"
vst3_subcategory = "Instrument|Synth"
windows_icon = "static/moose-minimal.ico"
macos_icon = "static/moose-minimal.icns"

[[plugin]]
name = "Moose Multiport"
bundle_id = "multiport"
crate = "moose-example-multiport"
# Multi-port MIDI *input* demo: two input ports, each a distinct patch.
# Route a separate track to each port (the Kontakt / VEP paradigm) and both
# play from one instance. VST3 event buses / CLAP note ports carry the port;
# other formats clamp to one port and play patch 0.
category = "instrument"
midi_input_ports = 2
fourcc = "TMlt"
vst3_subcategory = "Instrument|Synth"
windows_icon = "static/moose-minimal.ico"
macos_icon = "static/moose-minimal.icns"

# Suite installer wrapping every example above. `cargo moose package`
# (no flags) produces both per-plugin installers and this suite installer.
# Pass `--no-per-plugin` for suite-only output, `--no-suite` to drop it.
# Omitting `plugins` / `exclude_plugins` includes every `[[plugin]]`
# defined above; omitting `formats` falls back to each plugin's declared
# default features.
[[suite]]
name = "Moose Examples"
bundle_id = "moose-examples"

# Small two-plugin subset for exercising a subset install without
# packaging every example.
[[suite]]
name = "Moose Examples Subset"
bundle_id = "moose-examples-subset"
plugins = ["synth", "gain-egui-aspect"]

