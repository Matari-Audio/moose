# moose plugin project configuration
#
# This file is tracked. It carries project-level facts only: vendor info,
# plugin definitions, suite definitions, packaging metadata.
#
# Per-developer build environment (signing identities,
# notarization Apple ID / team ID, Authenticode certs) lives in the
# local `.cargo/config.toml` (gitignored), not here. See
# https://truce.audio/ for the complete list of env vars moose reads.
#
#   # .cargo/config.toml
#   [env]
#   MOOSE_SIGNING_IDENTITY = "Developer ID Application: Name (TEAMID)"
[vendor]
name = "Moose"
id = "com.moose"
url = "https://github.com/Matari-Audio/moose"
au_manufacturer = "Trce"

# Notarizing can be enabled after creating a MOOSE_NOTARY:
#   xcrun notarytool store-credentials MOOSE_NOTARY
#
[macos.packaging]
notarize = true
welcome_html = "static/moose-welcome.html"

[windows.packaging]
installer_icon = "static/moose-minimal.ico"
welcome_bmp = "static/moose-welcome.bmp"

# Each [[plugin]] entry defines a plugin to build and install.
# `cargo moose new <name>` scaffolds a new plugin under plugins/<name>/;
# the first-party examples in this repo live under examples/ for
# historical reasons.
#
# Per-format display-name overrides (all optional) let a plugin show
# under a different name in specific host browsers. Useful mostly
# during beta/alpha parallel ships. When a field is absent the format falls back to
# `name` above.
#
#   clap_name = "..."
#   vst3_name = "..."
#   # Optional exact 16-byte VST3 class ID; 32 hex characters.
#   vst3_class_id = "00112233445566778899aabbccddeeff"
#
[[plugin]]
name = "Moose Gain"
bundle_id = "gain"
crate = "moose-example-gain"
category = "effect"
fourcc = "TGan"
vst3_subcategory = "Tools"
windows_icon = "static/moose-minimal.ico"
macos_icon = "static/moose-minimal.icns"

