# moose plugin project configuration
#
# This file is tracked. It carries project-level facts only: vendor info,
# plugin definitions, suite definitions, packaging metadata.
#
# Per-developer build environment (signing identities,
# notarization Apple ID / team ID, Authenticode certs) lives in the
# local `.cargo/config.toml` (gitignored), not here.
#
#   # .cargo/config.toml
#   [env]
#   MOOSE_SIGNING_IDENTITY = "Developer ID Application: Name (TEAMID)"
[vendor]
name = "Moose"
id = "com.moose"
url = "https://github.com/Matari-Audio/moose"
au_manufacturer = "Trce"

# Notarizing can be enabled after creating a MOOSE_NOTARY:
#   xcrun notarytool store-credentials MOOSE_NOTARY
#
[macos.packaging]
notarize = true
welcome_html = "static/moose-welcome.html"

[windows.packaging]
installer_icon = "static/moose-minimal.ico"
welcome_bmp = "static/moose-welcome.bmp"

[[plugin]]
name = "Moose Gain"
bundle_id = "gain"
crate = "moose-example-gain"
category = "effect"
fourcc = "TGan"
au3_subtype = "TGn3"
au_tag = "Effects"
au3_name = "Moose Gain (AUv3)"
vst3_subcategory = "Tools"
windows_icon = "static/moose-minimal.ico"
macos_icon = "static/moose-minimal.icns"

[[plugin]]
name = "Moose Gain MUI"
bundle_id = "gain-mui"
crate = "moose-example-gain-mui"
category = "effect"
fourcc = "TGmu"
vst3_subcategory = "Tools"
windows_icon = "static/moose-minimal.ico"
macos_icon = "static/moose-minimal.icns"

[[plugin]]
name = "Moose Sidechain"
bundle_id = "sidechain"
crate = "moose-example-sidechain"
category = "effect"
fourcc = "TScm"
au3_name = "Moose Sidechain (AUv3)"
vst3_subcategory = "Tools"

[[plugin]]
name = "Moose Synth"
bundle_id = "synth"
crate = "moose-example-synth"
category = "instrument"
fourcc = "TSyn"
au3_subtype = "TSn3"
au_tag = "Synthesizer"
au3_name = "Moose Synth (AUv3)"
description = """
A subtractive monosynth built on the moose framework: saw / square \
/ triangle / sine oscillators, a resonant low-pass filter, and an \
ADSR envelope. Drop it onto \
your DAW's instrument track to play melodies, basslines, or pads.
"""
vst3_subcategory = "Synth"
windows_icon = "static/moose-minimal.ico"
macos_icon = "static/moose-minimal.icns"

[[plugin]]
name = "Moose Multiport"
bundle_id = "multiport"
crate = "moose-example-multiport"
category = "instrument"
fourcc = "TMlt"
au3_subtype = "TMl3"
au_tag = "Synthesizer"
au3_name = "Moose Multiport (AUv3)"
midi_input_ports = 2
vst3_subcategory = "Instrument|Synth"
windows_icon = "static/moose-minimal.ico"
macos_icon = "static/moose-minimal.icns"

[[suite]]
name = "Moose Examples"
bundle_id = "moose-examples"

[[suite]]
name = "Moose Examples Subset"
bundle_id = "moose-examples-subset"
plugins = ["synth", "gain-mui"]
