# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review settings. Reference: https://docs.coderabbit.ai/reference/configuration
# Note: Public mirror PRs (`matari/pr-*`) are mirrored from the Matari monorepo via Copybara.
# Finishing touches are disabled here so CodeRabbit does not generate docstring/unit-test commits
# on mirror branches; org-level Auto-fix rules in CodeRabbit must also exclude `Matari-Audio/moose`.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  commit_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  path_filters:
    - "!Cargo.lock"
    - "!**/Cargo.lock"
    - "!**/screenshots/**"
  tools:
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: false
chat:
  auto_reply: true
