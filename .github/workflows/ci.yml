name: CI

# Core workspace gate: fmt (Linux), clippy, every test (unit, integration,
# doc, screenshot, scaffold_e2e) and the SIMD perf guard, on all three OSes.
# Also calls the install / validate / package round-trips (cli-e2e.yml) and
# the example rt-paranoid check (ci-rt-paranoid.yml).
#
# On a PR, `changes` picks the OSes from the changed paths
# (scripts/ci/changed-oses.sh): a macOS-only change runs only the macOS
# jobs, a docs-only change runs none. Pushes to main run every OS. `ci-ok`
# always runs and fails if any selected job failed.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Trim debug info: keeps target/ under the runners' disk ceiling and
  # cuts link time (the MSVC linker + PDBs dominated the Windows job).
  # line-tables-only still gives file:line in panic backtraces. CI-only.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      # JSON lists of runner labels, e.g. ["macos-14"]
      oses: ${{ steps.pick.outputs.oses }}
      rt_oses: ${{ steps.pick.outputs.rt_oses }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            # HEAD is the PR merge commit: HEAD^1 is the base it merges into.
            git diff --name-only --no-renames HEAD^1 HEAD > changed.txt
            picked=$(scripts/ci/changed-oses.sh < changed.txt)
          else
            picked="macos windows linux"
          fi
          echo "OSes: ${picked:-none (docs only)}"
          oses=(); rt=()
          for o in $picked; do
            case $o in
              linux) oses+=(ubuntu-24.04); rt+=(ubuntu-24.04) ;;
              macos) oses+=(macos-14) ;;
              windows) oses+=(windows-latest); rt+=(windows-latest) ;;
            esac
          done
          json() { printf '%s\n' "$@" | jq -Rnc '[inputs | select(. != "")]'; }
          echo "oses=$(json "${oses[@]}")" >> "$GITHUB_OUTPUT"
          echo "rt_oses=$(json "${rt[@]}")" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.oses != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.oses) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The image ships several Xcodes + simulator runtimes (~40 GB) this job
      # never touches, and the debug target can peak past the free space.
      - name: Free runner disk
        if: runner.os == 'macOS'
        run: |
          sudo xcrun simctl runtime delete all 2>/dev/null || true
          keep="$(xcode-select -p)"; keep="${keep%/Contents/Developer}"
          for x in /Applications/Xcode*.app; do
            [ "$(readlink -f "$x")" = "$(readlink -f "$keep")" ] || sudo rm -rf "$x" &
          done
          wait
          df -h /


      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # `cache-bin: false` keeps the rustup proxies out of the cache (a
      # restored stale `rustup-init` once shadowed `cargo`). Only main saves:
      # PRs restore main's entry, so per-PR copies don't evict it from the
      # 10 GB repo cache. ci-rt-paranoid.yml and the gui-window job below
      # restore this same entry via `shared-key`.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-${{ matrix.os }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev mesa-vulkan-drivers \
            libwayland-dev \
            libasound2-dev libjack-jackd2-dev \
            libfontconfig1-dev libfreetype-dev \
            alsa-utils
          sudo tee /etc/asound.conf >/dev/null <<'EOF'
          pcm.!default { type null }
          ctl.!default { type null }
          EOF

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # One test build: lib/bin/test/example targets plus doctests (the
      # old `build --all-targets` + `test` pair compiled everything twice).
      # Benches are the one target `cargo test` skips; only moose-simd has
      # any, so build and smoke-run them on their own.
      #
      # Screenshot tests run here too. They used to be split cpu/gpu
      # because moose-example-eq opted into `moose-gui/gpu`, which would
      # have unified the GpuEditor onto every cpu example. Nothing enables
      # `gpu` any more (eq is `features = ["cpu"]`), so one invocation
      # builds the same cpu-only graph the baselines were baked with. If a
      # crate opts into `moose-gui/gpu` again, test it with its own `-p`
      # invocation and `--exclude` it here.
      - name: test
        # Windows runs cargo-moose's tests (scaffold_e2e: ~6 min of
        # scaffolded cargo builds) in the parallel `cargo-moose tests
        # (windows-latest)` job below; Linux/macOS keep them here.
        run: cargo test --workspace ${{ runner.os == 'Windows' && '--exclude cargo-moose' || '' }}
      - name: benches (test mode)
        run: cargo test -p moose-simd --benches

      # Ratio guard: gain_simd_fast must run >= 5x faster than the naive
      # gain shape on the same runner (~22x locally).
      - name: perf regression (gain vs gain-simd)
        run: cargo test --release -p moose-simd --test gain_perf_regression -- --ignored --nocapture

      # macOS runs the rt-paranoid example check here instead of in its own
      # job (ci-rt-paranoid.yml covers Linux/Windows): macOS queue slots are
      # the scarce resource, and this job already has the deps compiled.
      - name: rt-paranoid (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/ci/rt-paranoid.sh

      - name: upload failing screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-screenshots-${{ runner.os }}
          path: target/screenshots/
          if-no-files-found: ignore
          retention-days: 14

  cargo-moose-windows:
    # cargo-moose's own tests on Windows, split out of `test (windows)` to
    # run in parallel: scaffold_e2e scaffolds and builds real projects.
    name: cargo-moose tests (windows-latest)
    needs: changes
    if: contains(needs.changes.outputs.oses, 'windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cargo-moose
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test -p cargo-moose
        run: cargo test -p cargo-moose

  gui-window:
    # Newest macOS on purpose: the baseview hitTest: crash was an AppKit
    # isa-swizzling regression that only surfaced on a new OS.
    name: gui hitTest (windowed, newest macOS)
    needs: changes
    if: contains(needs.changes.outputs.oses, 'macos')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-window
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: windowed hitTest smoke
        run: ./scripts/gui-window-test.sh

  cli-e2e:
    name: cli
    needs: changes
    if: needs.changes.outputs.oses != '[]'
    uses: ./.github/workflows/cli-e2e.yml
    with:
      oses: ${{ needs.changes.outputs.oses }}

  rt-paranoid:
    name: rt-paranoid
    needs: changes
    if: needs.changes.outputs.rt_oses != '[]'
    uses: ./.github/workflows/ci-rt-paranoid.yml
    with:
      oses: ${{ needs.changes.outputs.rt_oses }}

  # The one check to watch: green when every selected job passed (skipped
  # jobs are fine), red if any failed or was cancelled.
  ci-ok:
    needs: [changes, test, cargo-moose-windows, gui-window, cli-e2e, rt-paranoid]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo '${{ toJSON(needs.*.result) }}'
          ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
