name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTDOCFLAGS: -D warnings

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: cargo doc
    runs-on: ubuntu-24.04
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # `cache-bin: false` keeps `~/.cargo/bin/` (the rustup proxies)
      # out of the cache. Caching it bit us with `cargo` resolving
      # to a stale `rustup-init` after restore — see the workflow
      # history if this needs revisiting.
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs-ubuntu-24.04
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev mesa-vulkan-drivers \
            libwayland-dev \
            libasound2-dev libjack-jackd2-dev \
            libfontconfig1-dev libfreetype-dev

      - name: cargo doc
        run: cargo doc --workspace --no-deps

      # Publishing needs GitHub Pages enabled with "GitHub Actions" as the
      # source (Settings -> Pages). Until it is, configure-pages 404s and
      # failed the whole job even though `cargo doc` passed; skip the
      # publish steps instead, so this job gates on rustdoc alone.
      - name: Pages enabled?
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not enabled for this repo; skipping the docs deploy."
          fi

      - name: redirect index.html → moose
        if: steps.pages.outputs.enabled == 'true'
        run: echo '<meta http-equiv="refresh" content="0; url=moose/">' > target/doc/index.html

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: target/doc

  deploy:
    name: deploy to Pages
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
