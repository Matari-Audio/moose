name: Bake screenshots

# Manually-triggered re-bake of every example's reference PNG on the
# same hosts that gate them in CI. Solves the "regenerated locally,
# CI still drifts" problem: dev machines can't match the GitHub
# runner's exact wgpu/Mesa/fontconfig stack, so cross-machine
# rasterizer drift produces sub-perceptual pixel diffs that
# `pixel_threshold(2)` won't absorb. Run this workflow, download the
# artifact, replace the references, commit. Drift only re-appears if
# GHA upgrades the runner image.
#
# The render scale is fixed at `moose_core::screenshot::DEFAULT_SCREENSHOT_SCALE`
# (currently 2.0) regardless of the runner's reported display DPI.
# Tests that opt into a custom scale via `ScreenshotTest::scale` need
# a separate manual bake — `cargo run -p cargo-moose -- screenshot
# --scale <x> --out …` — since this workflow doesn't enumerate per-test
# overrides.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to bake (any combination of linux,macos,windows)"
        type: string
        default: "linux,macos,windows"
        required: false
  # Manual only: it gates nothing (screenshot tests in ci.yml do), and
  # three full release builds per PR were pure cost. Dispatch it on a
  # branch to grab freshly rendered PNGs for a GUI change or a re-bake.

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Keep this list in sync with moose.toml's [[plugin]] entries that
  # have screenshot tests under examples/<crate>/src/lib.rs. The
  # `_linux` / `_macos` / `_windows` suffix on the output filename
  # matches the convention enforced by each example's
  # `gui_screenshot_<os>` test.
  EXAMPLE_CRATES: >-
    moose-example-gain
    moose-example-block-gain
    moose-example-synth
    moose-example-eq
    moose-example-stereo-utility
    moose-example-block-saturate
    moose-example-block-drywet
    moose-example-block-gate
    moose-example-block-widen
    moose-example-block-surround-meter
    moose-example-gain-egui
    moose-example-gain-egui-aspect
    moose-example-arpeggio
    moose-example-tremolo
    moose-example-state
    moose-example-fundsp-reverb-worker
    moose-example-fundsp-reverb-simple
    moose-example-transpose
    moose-example-gui-zoo
    moose-example-gui-zoo-egui
    moose-example-dasp-bitcrusher
    moose-example-envelope
    moose-example-chord
    moose-example-cc-filter
    moose-example-mpe-spreader
    moose-example-sysex-echo
    moose-example-mpe-synth
    moose-example-multiport

jobs:
  linux:
    if: contains(inputs.platforms, 'linux')
    name: bake (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # `cache-bin: false` keeps `~/.cargo/bin/` (the rustup proxies)
      # out of the cache. Caching it bit us with `cargo` resolving
      # to a stale `rustup-init` after restore — see the workflow
      # history if this needs revisiting.
      - uses: Swatinem/rust-cache@v2
        with:
          key: bake-ubuntu-24.04
          cache-bin: false

      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev mesa-vulkan-drivers \
            libwayland-dev \
            libasound2-dev libjack-jackd2-dev \
            libfontconfig1-dev libfreetype-dev

      - name: Build cargo-moose
        run: cargo build -p cargo-moose --release

      - name: Bake screenshots
        run: |
          set -euo pipefail
          for crate in $EXAMPLE_CRATES; do
            short="${crate#moose-example-}"
            short="${short//-/_}"
            out="examples/${crate}/screenshots/${short}_default_linux.png"
            echo "::group::Baking $out"
            ./target/release/cargo-moose screenshot -p "$crate" --out "$out"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: baked-screenshots-linux
          path: |
            examples/*/screenshots/*_linux.png
          if-no-files-found: error
          retention-days: 30

  macos:
    if: contains(inputs.platforms, 'macos')
    name: bake (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # Reclaim unused Xcodes + simulator runtimes; the bake never
      # touches either and the workspace target is disk-heavy.
      - name: Free runner disk
        run: |
          df -h /
          sudo xcrun simctl runtime delete all 2>/dev/null || true
          keep="$(xcode-select -p)"; keep="${keep%/Contents/Developer}"
          for x in /Applications/Xcode*.app; do
            [ "$(readlink -f "$x")" = "$(readlink -f "$keep")" ] || sudo rm -rf "$x" &
          done
          wait
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      # `cache-bin: false` keeps `~/.cargo/bin/` (the rustup proxies)
      # out of the cache. Caching it bit us with `cargo` resolving
      # to a stale `rustup-init` after restore — see the workflow
      # history if this needs revisiting.
      - uses: Swatinem/rust-cache@v2
        with:
          key: bake-macos-14
          cache-bin: false

      - name: Build cargo-moose
        run: cargo build -p cargo-moose --release

      - name: Bake screenshots
        run: |
          set -euo pipefail
          for crate in $EXAMPLE_CRATES; do
            short="${crate#moose-example-}"
            short="${short//-/_}"
            out="examples/${crate}/screenshots/${short}_default_macos.png"
            echo "::group::Baking $out"
            ./target/release/cargo-moose screenshot -p "$crate" --out "$out"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: baked-screenshots-macos
          path: |
            examples/*/screenshots/*_macos.png
          if-no-files-found: error
          retention-days: 30

  windows:
    if: contains(inputs.platforms, 'windows')
    name: bake (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # `cache-bin: false` keeps `~/.cargo/bin/` (the rustup proxies)
      # out of the cache. Caching it bit us with `cargo` resolving
      # to a stale `rustup-init` after restore — see the workflow
      # history if this needs revisiting.
      - uses: Swatinem/rust-cache@v2
        with:
          key: bake-windows-latest
          cache-bin: false

      - name: Build cargo-moose
        run: cargo build -p cargo-moose --release

      - name: Bake screenshots
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $crates = $env:EXAMPLE_CRATES -split '\s+' | Where-Object { $_ }
          foreach ($crate in $crates) {
            $short = ($crate -replace '^moose-example-', '') -replace '-', '_'
            $out = "examples/$crate/screenshots/${short}_default_windows.png"
            Write-Host "::group::Baking $out"
            & ./target/release/cargo-moose.exe screenshot -p $crate --out $out
            if ($LASTEXITCODE -ne 0) { throw "screenshot failed for $crate (exit $LASTEXITCODE)" }
            Write-Host "::endgroup::"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: baked-screenshots-windows
          path: |
            examples/*/screenshots/*_windows.png
          if-no-files-found: error
          retention-days: 30
