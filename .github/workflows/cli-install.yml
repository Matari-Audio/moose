name: cargo moose install + validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each OS job exercises `cargo moose install` end-to-end and then
# runs `cargo moose validate` against the freshly installed bundles -
# validate needs the plugin in the host's scan path, so the order is
# fixed (install first, validate second). The three OS jobs run in
# parallel.
jobs:
  macos:
    name: install + validate (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-install-macos-14
          cache-bin: false

      - name: Build cargo-moose
        run: cargo build -p cargo-moose

      - name: cargo moose doctor
        run: ./target/debug/cargo-moose doctor

      - name: Cache pluginval
        id: cache-pluginval
        uses: actions/cache@v4
        with:
          path: /Applications/pluginval.app
          key: pluginval-macos-1.0.4

      - name: Download pluginval
        if: steps.cache-pluginval.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -oq /tmp/pluginval.zip -d /Applications/

      - name: Cache clap-validator
        id: cache-clap-validator
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/clap-validator
          key: clap-validator-macos-2f716906

      - name: Install clap-validator
        if: steps.cache-clap-validator.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/free-audio/clap-validator --rev 2f71690639a742ce805574ce42e31250e3147aa9 clap-validator

      - name: Pre-flight - validators present
        run: |
          command -v clap-validator
          test -x /Applications/pluginval.app/Contents/MacOS/pluginval

      # System scope: CI macOS runners have passwordless sudo, so
      # --system exercises the /Library/Audio/Plug-Ins/ install path.
      - name: cargo moose install --system --clap --vst3
        run: sudo ./target/debug/cargo-moose install --system --clap --vst3 -p moose-example-gain

      - name: Verify installed bundle filetypes
        run: |
          set -e
          # CLAP / VST3 bundle binaries must be MH_BUNDLE.
          for fmt in "CLAP/Moose Gain.clap" "VST3/Moose Gain.vst3"; do
            otool -hv "/Library/Audio/Plug-Ins/$fmt/Contents/MacOS/Moose Gain" | tee /tmp/hdr.txt
            grep -q "BUNDLE" /tmp/hdr.txt || { echo "::error::$fmt expected MH_BUNDLE"; exit 1; }
          done

      - name: cargo moose status
        run: ./target/debug/cargo-moose status

      - name: cargo moose validate --clap --pluginval
        run: |
          set -e -o pipefail
          ./target/debug/cargo-moose validate --clap --pluginval -p moose-example-gain 2>&1 | tee validate.log
          if grep -E "SKIP|not found" validate.log >/dev/null; then
            echo "::error::validate skipped a step - failing"
            exit 1
          fi

      # Round-trip: uninstall every format we just installed and
      # confirm nothing is left behind. `--yes` bypasses the
      # confirmation prompt; system scope needs sudo to remove from
      # /Library/Audio/Plug-Ins/.
      - name: cargo moose uninstall --system --yes
        run: sudo ./target/debug/cargo-moose uninstall --system --yes -p moose-example-gain

      - name: Verify nothing left behind
        run: |
          set -e
          for fmt in "CLAP/Moose Gain.clap" "VST3/Moose Gain.vst3"; do
            if [ -e "/Library/Audio/Plug-Ins/$fmt" ]; then
              echo "::error::uninstall left $fmt behind"
              exit 1
            fi
          done

  linux:
    name: install + validate (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-install-ubuntu-24.04
          cache-bin: false

      - name: Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev mesa-vulkan-drivers \
            libwayland-dev \
            libasound2-dev libjack-jackd2-dev \
            libfontconfig1-dev libfreetype-dev \
            xvfb

      - name: Build cargo-moose
        run: cargo build -p cargo-moose

      - name: cargo moose doctor
        run: ./target/debug/cargo-moose doctor

      - name: Cache pluginval
        id: cache-pluginval
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/pluginval
          key: pluginval-linux-1.0.4

      - name: Download pluginval
        if: steps.cache-pluginval.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL -o /tmp/pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -oq /tmp/pluginval.zip -d /tmp/pluginval-bin
          install -m 755 /tmp/pluginval-bin/pluginval ~/.local/bin/pluginval

      - name: Cache clap-validator
        id: cache-clap-validator
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/clap-validator
          key: clap-validator-linux-2f716906

      - name: Install clap-validator
        if: steps.cache-clap-validator.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/free-audio/clap-validator --rev 2f71690639a742ce805574ce42e31250e3147aa9 clap-validator

      - name: Validators on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pre-flight - validators present
        run: |
          command -v clap-validator
          command -v pluginval

      - name: cargo moose install --clap --vst3
        run: ./target/debug/cargo-moose install --user --clap --vst3 -p moose-example-gain

      - name: Verify installed bundles
        run: |
          set -e
          ls -la "$HOME/.clap/"
          ls -la "$HOME/.vst3/"

      - name: cargo moose validate --clap --pluginval
        run: |
          set -e -o pipefail
          xvfb-run -a ./target/debug/cargo-moose validate --clap --pluginval -p moose-example-gain 2>&1 | tee validate.log
          if grep -E "SKIP|not found" validate.log >/dev/null; then
            echo "::error::validate skipped a step - failing"
            exit 1
          fi

      - name: cargo moose uninstall --user --yes
        run: ./target/debug/cargo-moose uninstall --user --yes -p moose-example-gain

      - name: Verify nothing left behind
        run: |
          set -e
          for fmt in ".clap/Moose Gain.clap" ".vst3/Moose Gain.vst3"; do
            if [ -e "$HOME/$fmt" ]; then
              echo "::error::uninstall left $fmt behind"
              exit 1
            fi
          done

  windows:
    name: install + validate (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-install-windows-latest
          cache-bin: false

      - name: Build cargo-moose
        run: cargo build -p cargo-moose

      - name: cargo moose doctor
        shell: bash
        run: ./target/debug/cargo-moose.exe doctor

      - name: Cache pluginval
        id: cache-pluginval
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.bin/pluginval
          key: pluginval-windows-1.0.4

      - name: Download pluginval
        if: steps.cache-pluginval.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p .bin/pluginval
          curl -fsSL -o pluginval.zip \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          unzip -oq pluginval.zip -d .bin/pluginval

      - name: Cache clap-validator
        id: cache-clap-validator
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/clap-validator.exe
          key: clap-validator-windows-2f716906

      - name: Install clap-validator
        if: steps.cache-clap-validator.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/free-audio/clap-validator --rev 2f71690639a742ce805574ce42e31250e3147aa9 clap-validator

      - name: Validators on PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.bin/pluginval" >> "$GITHUB_PATH"

      - name: Pre-flight - validators present
        shell: bash
        run: |
          command -v clap-validator
          command -v pluginval

      - name: cargo moose install --clap --vst3
        shell: bash
        run: ./target/debug/cargo-moose.exe install --user --clap --vst3 -p moose-example-gain

      - name: Verify installed bundles
        shell: bash
        run: |
          set -e
          ls -la "$LOCALAPPDATA/Programs/Common/CLAP/"
          ls -la "$LOCALAPPDATA/Programs/Common/VST3/"

      - name: cargo moose validate --clap --pluginval
        shell: bash
        run: |
          set -e -o pipefail
          ./target/debug/cargo-moose.exe validate --clap --pluginval -p moose-example-gain 2>&1 | tee validate.log
          if grep -E "SKIP|not found" validate.log >/dev/null; then
            echo "::error::validate skipped a step - failing"
            exit 1
          fi

      - name: cargo moose uninstall --user --yes
        shell: bash
        run: ./target/debug/cargo-moose.exe uninstall --user --yes -p moose-example-gain

      - name: Verify nothing left behind
        shell: bash
        run: |
          set -e
          for fmt in "CLAP/Moose Gain.clap" "VST3/Moose Gain.vst3"; do
            if [ -e "$LOCALAPPDATA/Programs/Common/$fmt" ]; then
              echo "::error::uninstall left $fmt behind"
              exit 1
            fi
          done
