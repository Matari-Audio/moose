name: rt-paranoid (audio-thread allocation check)

# Called from ci.yml, which picks the OSes from the changed paths.
on:
  workflow_call:
    inputs:
      oses:
        description: JSON list of runner labels (Linux/Windows) to run on
        type: string
        required: true

permissions:
  contents: read

# Must match ci.yml's env exactly: rust-cache hashes CARGO_* vars into
# the key, and this job restores ci.yml's `core-<os>` entry.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

# Builds the DSP-distinct example plugins with the `rt-paranoid` feature
# and runs their `assert_no_audio_alloc` tests, so any allocation the audio
# thread makes inside `process` fails the build. The scaffolded-plugin
# variant of this check runs in cli-e2e.yml.
#
# Runs on all three OSes (macOS inside ci.yml): an audio-thread allocation can be platform-
# specific (a std primitive that boxes lazily on one OS but not another),
# so the check only catches it where it happens.
jobs:
  examples:
    name: rt-paranoid (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs inside ci.yml's macOS test job (one fewer macOS slot).
        os: ${{ fromJSON(inputs.oses) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4


      - uses: dtolnay/rust-toolchain@stable

      # Restore-only: reuses ci.yml's third-party deps, never saves its own
      # copy (keeps the 10 GB repo cache from thrashing).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-${{ matrix.os }}
          cache-bin: false
          save-if: false

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers \
            libasound2-dev libjack-jackd2-dev \
            libfontconfig1-dev libfreetype-dev

      - name: rt-paranoid check on example plugins
        shell: bash
        run: ./scripts/ci/rt-paranoid.sh
