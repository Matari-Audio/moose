name: Truce upstream review
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tracker
        run: python3 scripts/truce-upstream.py --self-test
      - name: Report changes since the last review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/truce-upstream.py
