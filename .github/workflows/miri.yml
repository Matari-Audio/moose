name: Miri

# UB detection on the pure-Rust core: the buffer transmutes, the
# mediation lock, the state/UMP parsers. FFI surfaces (shims, GUI,
# cpal) can't run under Miri; pluginval/clap-validator remain their harness.
on:
  push:
    branches: [main]
    paths:
      - 'crates/moose-core/**'
      - 'crates/moose-params/**'
      - 'crates/moose-utils/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/miri.yml'
  pull_request:
    paths:
      - 'crates/moose-core/**'
      - 'crates/moose-params/**'
      - 'crates/moose-utils/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/miri.yml'
  # The toolchain's borrow-model evolves independently of the code;
  # a weekly run surfaces new Miri findings against an idle repo.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  # `event_name` in the group so the weekly cron run can't cancel an
  # in-flight push run on the same ref (both resolve to refs/heads/main).
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  miri:
    name: miri (nightly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Default borrow model (Stacked Borrows) - the suite is green
      # under it; a switch to tree borrows should be a deliberate,
      # recorded decision, not drift. `+nightly` on every invocation:
      # the runner image ships stable as the rustup default, and the
      # toolchain action installs nightly without changing that, so a
      # bare `cargo miri` resolves to stable and finds no miri.
      # Full leak checking. The task-pool tests are carved into their own
      # step below (they leak worker threads by design), so leak detection
      # stays on for every other crate and test here.
      - name: miri test (moose-core)
        run: cargo +nightly miri test -p moose-core --lib -- --skip tasks::tests

      # The managed background-task pool (`moose-core::tasks`) spawns
      # process-global worker threads that never join by design, so Miri's
      # default check flags them as "leaked" at exit. Scope
      # `-Zmiri-ignore-leaks` to just these tests: the pool's cross-thread
      # handshake still runs under Miri (data-race checking, the point of
      # running it here), while everything above keeps full leak detection.
      - name: miri test (task pool)
        run: cargo +nightly miri test -p moose-core --lib tasks::tests
        env:
          MIRIFLAGS: -Zmiri-ignore-leaks

      # The mediation two-thread repro across several schedules: one
      # thread write-locking the plugin per block, one doing the
      # mediated MeterStore / try_lock reads. This is the regression
      # guard against reintroducing a raw-pointer shortcut - Miri's
      # data-race detector flags the pre-mediation pattern.
      - name: miri test (mediation schedules)
        run: cargo +nightly miri test -p moose-core --test mediation_repro
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..8

      # Multi-seed data-race and UB sweep on the unsafe-heavy core handoffs
      # (PluginCell, SnapshotSlot, transport seqlock, state load queue).
      - name: miri test (PluginCell, SnapshotSlot, transport seqlock, state queue)
        run: "cargo +nightly miri test -p moose-core --lib -- wrapper:: snapshot:: transport:: state::"
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..4

      # moose-utils and moose-params both carry #![forbid(unsafe_code)];
      # run them on the weekly schedule and manual dispatch.
      - name: miri test (moose-utils, moose-params)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cargo +nightly miri test -p moose-utils -p moose-params

      # Fuzz corpus replay dropped until moose has its own harness repo
      # (truce-audio/truce-fuzz-tests path-depends on truce-* crates).
