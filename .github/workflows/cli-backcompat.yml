name: scaffold backwards-compat

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Asks one question, on each scaffold shape: would a plugin
# scaffolded by the LAST released `cargo-moose` still compile against
# THIS commit of moose?
#
# Catches accidental breakage in the public surface that older
# scaffold-templated plugins lean on (renamed prelude items, dropped
# re-exports, derive-macro signature shifts).
#
# v1 scope: Linux only, against the latest git tag. Three shapes
# (effect, instrument, workspace-mixed) run as parallel matrix jobs
# so a regression in one template doesn't mask the others. Tag
# resolution runs once in a setup job and feeds the matrix.
# Linux is cheaper / faster than macOS for the pure-Rust `cargo
# check` we run; format-specific install/package coverage stays on
# the platform-specific workflows.

# `cargo install` of the released cargo-moose takes ~1 min on a
# fresh runner; we cache it by tag and reuse across the three
# matrix shapes. The setup job resolves the tag and primes the
# cache. The matrix jobs use `actions/cache/restore` (read-only)
# and fall back to installing themselves on miss - the first run
# of a new tag races cache upload against matrix-job dispatch and
# can land on a cache miss, so the matrix must be self-sufficient.
jobs:
  setup:
    name: resolve last release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      skip: ${{ steps.bump.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Latest non-prerelease tag on the moose repo, e.g. `v0.43.0`.
      # Sort by semver-ish descending; pick the first plain
      # `vN.M.P` (skip alpha/beta/rc).
      - name: Resolve latest released tag
        id: latest
        shell: bash
        run: |
          tag=$(git ls-remote --tags --sort='-v:refname' \
                  https://github.com/Matari-Audio/moose \
                  | { grep -oE 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
                  | head -1 \
                  | sed 's|refs/tags/||')
          # No MOOSE release yet: nothing to be backwards-compatible
          # with, so the bump step below skips the matrix.
          if [ -z "$tag" ]; then
            echo "::notice::No released tags on Matari-Audio/moose yet; skipping backcompat."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Latest released tag: $tag"

      # A major version bump is a deliberate break of the public
      # surface, so scaffolds from the last release are *expected* not
      # to compile against HEAD - running backcompat would only produce
      # a red X for a break we intended. On a push (the release lands on
      # main) we skip in that case. Pull requests always run, so the
      # breakage is still visible while the major is in review.
      - name: Detect major version bump
        id: bump
        shell: bash
        run: |
          if [ -z "${{ steps.latest.outputs.tag }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          released_major=$(echo "${{ steps.latest.outputs.tag }}" \
                             | sed -E 's/^v([0-9]+)\..*/\1/')
          current=$(grep -m1 -E '^version = ' Cargo.toml \
                     | sed -E 's/^version = "([^"]+)".*/\1/')
          current_major=${current%%.*}
          echo "released major: $released_major, current major: $current_major"
          if [ "${{ github.event_name }}" = "push" ] \
             && [ "$current_major" -gt "$released_major" ]; then
            echo "Major version bump ($released_major -> $current_major) on push; skipping backcompat."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache released cargo-moose
        id: cache-old-cargo-moose
        if: steps.bump.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/old-cargo-moose
          key: old-cargo-moose-${{ steps.latest.outputs.tag }}-ubuntu

      - name: Install released cargo-moose
        if: steps.bump.outputs.skip != 'true' && steps.cache-old-cargo-moose.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install --git https://github.com/Matari-Audio/moose \
                        --tag "${{ steps.latest.outputs.tag }}" \
                        cargo-moose \
                        --root "$RUNNER_TEMP/old-cargo-moose"

  backcompat:
    needs: setup
    # Always run on pull requests; on push, skip when the setup job
    # detected a major version bump (an intended break of the surface
    # this workflow guards).
    if: needs.setup.outputs.skip != 'true'
    name: ${{ matrix.shape.id }} (scaffold w/ ${{ needs.setup.outputs.tag }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shape:
          - id: effect
            new_args: "probe-fx --vendor Probe --vendor-id com.probe.test"
            project_dir: probe-fx
          - id: instrument
            new_args: "probe-synth --instrument --vendor Probe --vendor-id com.probe.test"
            project_dir: probe-synth
          - id: workspace-mixed
            new_args: "probe --workspace fx synth midi --type:synth=instrument --type:midi=midi --vendor Probe --vendor-id com.probe.test"
            project_dir: probe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-backcompat-${{ matrix.shape.id }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Same Linux dep set the other CI workflows install. The
      # scaffolded plugin pulls moose-standalone (cpal → alsa-sys
      # needs libasound2-dev), moose-gui (X11 / wayland / fontconfig),
      # and wgpu (Mesa / Vulkan). Without these, `cargo check` fails
      # in alsa-sys's build script before reaching any Rust code.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrandr-dev \
            libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers \
            libasound2-dev libjack-jackd2-dev \
            libfontconfig1-dev libfreetype-dev

      # Restore the cargo-moose binary the setup job primed. On a
      # cache miss (new tag, cache propagation lag), the next step
      # installs the binary directly so this matrix is self-sufficient.
      - name: Restore released cargo-moose from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/old-cargo-moose
          key: old-cargo-moose-${{ needs.setup.outputs.tag }}-ubuntu

      - name: Install released cargo-moose (cache-miss fallback)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install --git https://github.com/Matari-Audio/moose \
                        --tag "${{ needs.setup.outputs.tag }}" \
                        cargo-moose \
                        --root "$RUNNER_TEMP/old-cargo-moose"

      - name: Show released cargo-moose version
        shell: bash
        run: |
          "$RUNNER_TEMP/old-cargo-moose/bin/cargo-moose" --version || \
          "$RUNNER_TEMP/old-cargo-moose/bin/cargo-moose" -h | head -1

      - name: Scaffold (${{ matrix.shape.id }})
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/scaffold"
          cd "$RUNNER_TEMP/scaffold"
          "$RUNNER_TEMP/old-cargo-moose/bin/cargo-moose" new ${{ matrix.shape.new_args }}
          ls -la "${{ matrix.shape.project_dir }}/"

      # Rewrite scaffolded `{ git = ".../moose", tag = "..." }` deps
      # to `{ path = "<workspace>/crates/<name>" }` so the older
      # scaffold consumes THIS commit of moose instead of the
      # published tag it was generated against. Shared with
      # `cli-e2e.yml`.
      - name: Rewrite git deps to local moose HEAD
        env:
          SCAFFOLD_DIR: ${{ runner.temp }}/scaffold/${{ matrix.shape.project_dir }}
        run: python3 scripts/ci/rewrite-scaffold-deps.py

      # `cargo check` (not `build`) is enough for the contract this
      # workflow guards: catches removed / renamed public items the
      # scaffold template uses. Build / link is downstream and out of
      # scope for backwards-compat (the install + package CI in
      # `cli-e2e.yml` already exercises those against current
      # templates).
      - name: cargo check against moose HEAD
        shell: bash
        working-directory: ${{ runner.temp }}/scaffold/${{ matrix.shape.project_dir }}
        run: cargo check --all-targets
